[project]
name = "kairos"
version = "0.3.0"
# dynamic = ["version"]
description = "Kairos - Sensor monitoring and Reporting"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
classifiers = ["Private :: Do Not Upload",
            "Development Status :: 3 - Alpha",
            "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
            "Operating System :: POSIX :: Linux",
            "Programming Language :: Python :: 3",
]
authors = [
{ name = "Matt Martini", email = "matt.martini@gmail.com" }
]
maintainers = [
{ name = "Matt Martini", email = "matt.martini@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
  "adafruit-blinka-raspberry-pi-pwm>=1.0.2",
  "adafruit-blinka>=10.0.0",
  "adafruit-circuitpython-ads7830>=1.0.8",
  "adafruit-circuitpython-dht>=4.0.12",
  "adafruit-circuitpython-pcf8591>=1.0.25",
  "adafruit-circuitpython-scd4x>=1.4.13",
  "adafruit-circuitpython-sht4x>=1.0.27",
  "adafruit-circuitpython-shtc3>=1.1.22",
  "board>=1.0",
  "gpiod>=2.2.2, <3; sys_platform == 'linux'",
  "isstreamer>=2.0.0",
  "rich>=15.0.0",
  "rpi-gpio>=0.7.1; sys_platform == 'linux'",
  "rpi-ws281x>=4.0.0; sys_platform == 'linux'",
  "simple-pid>=2.0.1",
]

[dependency-groups]
dev = [
  "black>=26.10.1",
  "bpython>=0.26",
  "bump-my-version>=1.6.7",
  "flake8-pytest-style>=2.2.0",
  "flake8>=7.4.1",
  "pdoc>=16.0.0",
  "pylint>=4.1.3",
  "pytest-cov>=7.1.0",
  "pytest-html>=4.2.0",
  "pytest-random-order>=1.2.0",
  "pytest-sugar>=1.1.1",
  "pytest>=9.2.0",
  "ruff-lsp>=0.0.62",
  "ruff>=0.17.3",
  "wat-inspector>=0.4.3",
]

[project.urls]
Changelog = "https://github.com/mattmartini/Kairos/blob/main/CHANGELOG.md"
Documentation = "https://github.com/mattmartini/Kairos/tree/main/docs"
# Homepage = "https://pypi.org/project/Kairos/"
Issues = "https://github.com/mattmartini/Kairos/issues"
Repository = "https://github.com/mattmartini/Kairos"

[project.scripts]
kairos = "kairos:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

# requires = ["setuptools>=61"]
# build-backend = "setuptools.build_meta"
# 
# [tool.setuptools.packages.find]
# where = ["src"]
[tool.uv]
environments = [
  "sys_platform == 'darwin'",
  "sys_platform == 'linux'",
]

[tool.pytest.ini_options]
# pythonpath = "src"  # not needed?
testpaths = [ "tests", "intergration" ]
addopts = "-ra --showlocals --import-mode=importlib -v"
log_cli = true
log_cli_level = "DEBUG"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
minversion = "6.0"
filterwarnings = "ignore"
cache_dir = ".pytest_cache"
norecursedirs = ["docs", "build", "scratch", "service"]
markers = ["initial"]

[tool.black]
exclude = '''/
# Default values for Black.
\.eggs|\.git|\.hg|\.mypy_cache|\.nox|\.tox|\.venv|\.svn|_build|buck-out|build|dist
/'''


[tool.pylint]
# Naming style matching correct constant names.
#const-naming-style=UPPER_CASE
const-naming-style="any"

# Naming style matching correct function names.
#function-naming-style=snake_case
function-naming-style="any"

# Naming style matching correct class names.
class-naming-style="PascalCase"

good-names=["i", "j", "k", "f", ]

# Naming style matching correct method names.
method-naming-style="snake_case"

# Naming style matching correct module names.
module-naming-style="snake_case"

# Naming style matching correct variable names.
#variable-naming-style=snake_case
variable-naming-style="any"

# Naming style matching correct argument names.
#argument-naming-style=snake_case
argument-naming-style="any"


[tool.flake8]
ignore = ["E203", "E266", "E501", "W503", ]
max-line-length = "88"
max-complexity = "15"
select = ["B", "C", "E", "F", "W", "T4"]

[tool.isort]
multi_line_output="3"
include_trailing_comma="True"
force_grid_wrap="0"
use_parentheses="True"
line_length="88"


